# ManusTrade Configuration Template
# Copy this file to config.ini and enter your credentials.

[gemini]
# รายการ API Keys คั่นด้วยจุลภาค (,) สลับใช้อัตโนมัติเมื่อโควตาเต็มหรือ Error
api_keys = YOUR_GEMINI_API_KEY_1, YOUR_GEMINI_API_KEY_2

# โมเดลแนะนำ: gemini-3.1-flash-lite (โมเดล Lite ล่าสุด เร็วสุด ประหยัดโควตา ไม่ติด 503)
model_name = gemini-3.1-flash-lite

[trading]
# สินทรัพย์ที่ต้องการเทรด (รองรับหลายตัวคั่นด้วยจุลภาค เช่น GOLD#, EURUSD#, USDJPY#, BTCUSD#)
symbols = GOLD#, EURUSD#, USDJPY#, BTCUSD#
symbol = GOLD#
# กรอบเวลา: M1, M5, M15, M30, H1, H4, D1
timeframe = M1
# จำนวนแท่งเทียนย้อนหลังที่ส่งให้ AI วิเคราะห์
history_bars = 40
# ระดับความมั่นใจขั้นต่ำของ AI ในการเปิดออเดอร์ (0.0 ถึง 1.0)
min_confidence = 0.65
# Magic Number สำหรับแยกออเดอร์ของบอทนี้
magic_number = 888999

[risk]
# เปอร์เซ็นต์ความเสี่ยงต่อไม้จาก Balance (เช่น 1.0 = 1%)
risk_percent = 1.0
# Fix Lot หากไม่ต้องการคำนวณตาม Risk (0 = ใช้ Dynamic Risk)
fixed_lot = 0.01
# ขีดจำกัด Max Spread (Point/Pip) หากสเปรดกว้างเกินจะไม่เปิดออเดอร์
max_spread_points = 50.0
# อัตราส่วน Risk to Reward ขั้นต่ำที่ยอมรับได้
min_rr_ratio = 1.5
# ขีดจำกัดจำนวนไม้แพ้ติดต่อกันก่อนตัดวงจร (Circuit Breaker)
consecutive_loss_limit = 2
# ระยะเวลาพักเทรดหลังออเดอร์แพ้ (นาที) เพื่อป้องกัน Revenge/Whipsaw
loss_cooldown_minutes = 3
# ขีดจำกัด Drawdown รายวันสูงสุด (% ของ Balance) หากเกินจะหยุดเทรดทั้งวัน (ผ่านเกณฑ์กองทุน)
max_daily_drawdown_percent = 3.0
# โควตาเทรดสูงสุดต่อชั่วโมง ป้องกัน Overtrading บน M1
max_trades_per_hour = 4
# ระยะ Stop Loss ขั้นต่ำสุด (Points/USD) เพื่อไม่ให้โดน Market Noise ในแท่ง M1
min_sl_points = 6.0
# เปิดระบบป้องกันข่าวแรง (News Shield) หยุดเทรดเมื่อมีข่าวกล่องแดง (เช่น CPI/PPI/Retail Sales)
news_protection_enabled = true

[mt5]
login = YOUR_MT5_LOGIN_ID
password = YOUR_MT5_PASSWORD
server = XMGlobal-MT5 5
